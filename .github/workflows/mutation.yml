name: Mutation testing

# Stryker is slow, so it is deliberately NOT part of the PR gate. It runs weekly and
# on demand to measure how effectively the tests actually catch bugs (mutation score),
# scoped to the Application (business-logic) project. The break threshold is 0, so this
# job reports but never fails the build — raise it in stryker-config.json once a baseline
# is established.
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  mutation:
    name: Stryker (Application)
    runs-on: ubuntu-latest
    # Only the fast tests run (test-case-filter in stryker-config.json): with the integration tests
    # every mutant's session booted its own containers, and the growing project ran into this limit
    # from October on. Stryker writes its report only at the very end, so hitting the limit loses the
    # whole run; that is why it is several times what a run takes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run Stryker
        # Stryker's default is half the cores, but without containers the work is all CPU.
        run: dotnet stryker --concurrency "$(nproc)"

      - name: Publish mutation report to job summary
        if: always()
        run: |
          report=$(find StrykerOutput -name '*.md' | sort | tail -n1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stryker-report
          path: StrykerOutput/**/reports/*.html
          retention-days: 14
