    <script id="__PRELOADED_DATA__" type="application/json">
{"success":true,"data":{"public":{"_id":"beginners-guide","updatedAt":"2026-08-20T00:00:00.000Z","lastUpdatedBy":"","title":"Beginner's Guide to Geoguessr","slug":"beginners-guide","code":"XX-BEGINNERS","cat":["General Guide"],"heroImage":"/images/beginners-guide/banner3.jpg","headerNotes":["While Geoguessr once was just a fun novelty game to pass the time, it now has a strong playerbase that spends a lot of time practising and researching in order to make the best guesses possible. This can make learning Geoguessr seem like a daunting task, particularly since most popular content creators are very experienced players that frequently use very in-depth and obscure clues.","However, it is not as hard as it may seem to get into Geoguessr. Using the proper tools, anyone can have fun and be competitive in this game. With this guide we aim to make the learning experience as accessible as possible. To help newer players, we will introduce the game mechanics and different gamemodes. After that, we will explain the ways in which experienced players manage to achieve great guesses based off of seemingly very little information. Finally, we will outline the tools and practices that we recommend for practising effectively.","There is a [Glossary](#5) at the end of this guide containing many Geoguessr-specific terms that are frequently used in the community."],"layout":"left","steps":[{"kind":"tip","title":"Game mechanics","items":[{"kind":"divider","id":"3163","title":"In game"},{"kind":"text","id":"LFAW","text":["When you load into a round of a singleplayer game, you will see the interface pictured below."]},{"kind":"centeredImageWithCaption","id":"n5tt","image":{"imageUrl":"/images/beginners-guide/Geoguessr_HUD.png","imageLink":"#","alt":""},"text":"The interface of a classic game of Geoguessr with moving settings."},{"kind":"divider","id":"TtRT","title":"The Compass"},{"kind":"centeredImageWithCaption","id":"z8YP","image":{"imageUrl":"/images/beginners-guide/Compass_line_up_2.png","imageLink":"#","alt":""},"text":"An example of lining up the road in Uruguay."},{"kind":"divider","id":"c97a","title":"Pinpointing a round"},{"kind":"centeredVideoWithCaption","id":"WdT4","video":{"videoSrc":"/images/beginners-guide/5k-showcase.mp4","poster":"/images/beginners-guide/5k-showcase-thumbnail.webp","alt":""},"text":"An example 5k in a pinpointable map."}]},{"kind":"tip","title":"Gamemodes","items":[{"kind":"text","id":"Bkh2","text":["There is a variety of ways of playing Geoguessr. From taking as much time as you need to get the exact location of a round in a moving game, to trying to guess the right country in 0.1 seconds but the screen is scrambled, upside down, and in black and white, there is a gamemode for everyone.","In the settings screen of a classic game you will find these four options if you turn off the default settings.","- **Round time**: You can use this setting to introduce a time limit to your games.","- **Move**: This settings controls whether you can move in the game or not. To move, you can click in the distance in the road, click on the two directional arrows you will see at the bottom of the screen, or press the keys “W” to go forwards and “S” to go backwards (in a QWERTY keyboard).","- **Pan**: This settings refers to whether you are allowed to pan around and see your surroundings. You pan by left-clicking with your mouse on the image and moving it around while clicked.","- **Zoom**: This setting controls if you are allowed to zoom in and out. You can do so with the scroll wheel of your mouse or the “+” and “-” buttons found in the bottom left of the screen. The Pan and Zoom settings are almost exclusively linked, as playing with zoom but not pan enabled or vice versa leads to somewhat wonky gameplay."]},{"kind":"subsection","id":"McvJ","title":"Single player games"},{"kind":"text","id":"Bkwr","text":["Geoguessr players often talk about three different main gamemodes.","- **Moving games**: The objective of moving games should be to get a perfect score (casually known as a 25k) and they should be played on pinpointable maps. Sometimes these games are played with a limited amount of time, like on Geoguessr’s official Daily Challenge.","- **No move**: This is the most common gamemode for country and region streaks, although people also attempt to get highscores and even perfect games using this setting.","- **NMPZ (No moving, panning or zooming)**: In this challenging gamemode all you get is a single image. Good maps frequently pan locations away from car meta, so countries that are usually recognized by the Google car offer a new challenge."]},{"kind":"subsection","id":"go2f","title":"Cooperative games"},{"kind":"divider","id":"O35C","title":"Making and playing in a Party"},{"kind":"text","id":"7pgH","text":["From the main menu, you can click the Party button in the left to create a Party lobby. From here, you can select a variety of gamemodes to play. Once the gamemode has been selected you can change the settings. There is some general settings, like changing whether chat is enabled, or if you want to make the party public, and some gamemode specific settings, such as round time, moving, panning or zooming, Battle Royale Power Ups, etc.","Public parties can be found in the [Community page](https://www.geoguessr.com/community/parties), if you choose to make your party public it will appear here.","The host of the party can share a link to join the party, or a 5-digit alphanumerical code that you can enter in [this](https://www.geoguessr.com/join) page. ","While only Pro users can host parties, people without a subscription can play in party games without a time limit, so this can be a great way to introduce Geoguessr to friends and family without them needing to commit to a paid subscription."]},{"kind":"subsection","id":"mE0Y","title":"Competitive games"},{"kind":"text","id":"synQ","text":["Competitive Geoguessr is mainly played in the “Duels” format, but they can be played on different settings. There are also some other competitive gamemodes. In the Multiplayer section of the Geoguessr website you can find the following gamemodes.","- **Duels**: In a duel, both players start with 6000 points of health and play the same rounds. After one player guesses, the other has 15 extra seconds to guess. After that, the difference in score is dealt as damage to the health of the player that guessed furthest away. ","- - The damage dealt is multiplied by a factor (**multiplier**). Starting at 1, a player's individual multiplier increases by 0.5 for every time they make a better guess than their opponent. This means that even slightly better guesses, for example in small countries, are useful to improve your multiplier and eventually win the game.","- - In the Gold, Silver and Bronze Divisions, games are played on either a **Moving** or a **No Move** format. Players in the Master and Champion Divisions have access to **NMPZ** duels.","- - The maps rotate every 4-6 weeks and differ depending on the gamemode and the Division you are in. Below the Master Division, the map is currently A Progression World. Duels in the Master and Champion divisions are played on other community-made maps such as A Moving World, Yellow Belly and An Arbitrary Rural World. The official overview can be found [here](https://www.geoguessr.com/multiplayer/how-it-works).","- - There are 17 divisions from Bronze IV all the way up to Champion. Every week, players compete for promotion to a higher division. In Gold, Silver and Bronze, the standings are determined by weekly points earned, in higher divisions solely by your rating.","- **Team Duels**: Play a casual or ranked game of duels with a friend. You can communicate through in-game chat with your teammate.","- **Battle Royale Countries**: In this gamemode you have 3 attempts in each round to guess the right country. The last person to guess the right country on each round (or everyone that did not manage to do so) gets eliminated until there is only one remaining. The game is played in a moving format, with a maximum time limit of a minute and a half. During the first 15 seconds you can “lock in” your guess, if every players locks in the right country they all go through to the next round. This gamemode is found in the Unranked part of Multiplayer.","- **Battle Royale Distance**: In this gamemode you have a minute to guess as close as possible to the location, the person furthest away each round gets eliminated. You can have up to 3 guesses, but to regain two of them you need to guess in the right country and within a certain distance of the location. This gamemode is found in the Unranked part of Multiplayer.","But wait! There is more!","- **Chatguessr** is a tool used by Twitch streamers to host games of Geoguessr and allow their viewers to send their guesses through a website. It is customary to allow the winner of a game to choose the map for the next one. ","- **Live Challenges** is an official gamemode that can be used in parties, up to 100 players can play the same 5 round seed of Geoguessr. Streamers sometimes organize lobbies of this gamemode, and every now and then there are Live Challenges tournaments.","- **Community tournaments** take place every week, from casual tournaments mostly for fun, to prize money tournaments where you can find many top players. Community organized tournaments are the best way to get into the most serious side of competitive Geoguessr. Tournaments are usually played as team duels in a variety of different maps."]}]},{"kind":"tip","title":"What to look for in-game","items":[{"kind":"text","id":"ATgu","text":["In order to make an educated guess, experienced Geoguessr players will look for specific clues and consider a variety of different factors. In this section we will explain the most common types of clues you should try to look for when you load into a round of Geoguessr.","A single type of clue will not work for every country, as some countries can be easily recognized by a very specific clue that only applies to it, while others require using a combination of many of the clues detailed below. At first we recommend focusing on the clues that you will see in most rounds, and steadily incorporating more obscure clues into your arsenal.","To learn more about the specific applications of the different types of clues, you may look at each respective country’s Plonk It Guide.","Due to the length of this page, here are shortcuts to the main sections in which it is divided."]},{"kind":"navButtons","id":"vxfq"},{"kind":"subsection","id":"lzfI","title":"General clues"},{"kind":"divider","id":"RsYM","title":"Sun direction"},{"kind":"centeredImage","id":"bMdz","imageUrl":"/images/beginners-guide/whattolook_sundirection.png"}]}],"draftChangelog":[]}}}
