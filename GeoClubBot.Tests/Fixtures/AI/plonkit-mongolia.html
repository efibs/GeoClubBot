"text":["While there are many unique Street View cars in Mongolia, for the sake of brevity, this guide only covers the most high-yield car metas. Car meta is very useful for Mongolia, however it is certainly possible to learn Mongolia without relying on cars.","Roads highlighted in red will **only** have that car, while roads highlighted in pink can have **more than one** car. Roads in grey are hidden coverage."]},{"kind":"tip","id":"WGaz","data":{"image":{"imageUrl":"/images/mongolia/2._carrubberinlays.png","imageLink":"/images/mongolia/2._carrubberinlays.png","alt":"","width":0.573},"text":["The roof racks of the Street View car are very useful as they can effectively split Mongolia in half. The presence of **rubber inlays** in the roof racks are generally found in the **west**, while **empty roof racks** are generally found in the **east**.","_You can click on the map to enlarge it._"]}},{"kind":"tip","id":"62RZ","data":{"image":{"imageUrl":"/images/mongolia/AgNVVGk.png","imageLink":"https://maps.app.goo.gl/nsxUkPTFhM5N6kHW8","alt":"","width":0.573},"text":["The tent with **4 straps** covers most of central-northern Mongolia."]}},{"kind":"tip","id":"gdTt","data":{"image":{"imageUrl":"/images/mongolia/6D2hMXf.png","imageLink":"https://maps.app.goo.gl/TR5gr1u84YkWit8b6","alt":"","width":0.573},"text":["You can find a tent with an **open zipper** in central Mongolia, near the town of Khorgo."]}}]},{"kind":"tip","title":"Spotlight","items":[{"kind":"divider","id":"ZNO1","title":"Towns"},{"kind":"tip","id":"lmEn","data":{"image":{"imageUrl":"/images/mongolia/3._townerdenet.png","imageLink":"https://www.google.com/maps/@49.027989,104.046817,3a,133.2y,65.7h,92.97t/data=!3m4!1e1!3m2!1sgR3O4GBtsIXq946khUZDzw!2e0","alt":"","width":0.573},"text":["Erdenet is the second largest city in Mongolia. As such, it has many multistory buildings that can be seen from across town, a large stadium, and a **ferris wheel** in the south of the city. It is surrounded by large barren hills
